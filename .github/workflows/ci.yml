name: PerPay CI

on:
  push:
    branches: [ main, "integration/*" ]
  pull_request:
    branches: [ main ]

jobs:
  gateway-tests:
    name: Gateway Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gateway Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic requests
      - name: Run Gateway Unit Tests
        run: |
          python -m unittest gateway/tests/test_payper_backend.py

  frontend-tests:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Frontend Dependencies
        run: npm ci || npm install
      - name: Typecheck and Build Frontend
        run: npm run build
      - name: Run Frontend Tests
        run: npm run test:frontend

  x402-tests:
    name: x402 Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install x402 Dependencies
        working-directory: ./x402-service
        run: npm install
      - name: Typecheck x402 Service
        working-directory: ./x402-service
        run: npm run typecheck
      - name: Run x402 Unit Tests
        working-directory: ./x402-service
        run: npm test

